name: Selenium CI Pipeline

on:
  push:
    branches:
      - "main"
      - "selenium/hangtran2/feature/login" # ✅ Thêm nhánh của bạn vào đây
      # - "selenium/**"  <-- Mẹo: Nếu bạn muốn chạy cho mọi nhánh bắt đầu bằng 'selenium/' thì dùng dòng này

  pull_request:
    branches:
      - "main"
      - "selenium/hangtran2/feature/login"

  workflow_dispatch:
    inputs:
      suite_name:
        description: 'Nhập tên file Suite XML cần chạy'
        required: true
        default: 'testng-smoke.xml'
      browser_name:
        description: 'Trình duyệt'
        required: true
        default: 'chrome'

jobs:
  test-on-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Selenium Tests
        run: |
          SUITE="${{ inputs.suite_name || 'testng-smoke.xml' }}"
          BROWSER="${{ inputs.browser_name || 'chrome' }}"

          # Nếu chạy tự động (push), input sẽ rỗng, ta gán cứng giá trị mặc định để tránh lỗi
          if [ -z "$SUITE" ]; then SUITE="testng-smoke.xml"; fi

          echo "🚀 Đang chạy suite: $SUITE trên nhánh: ${{ github.ref_name }}"

          mvn clean test \
            -DsuiteTestFile=$SUITE \
            -DHEADLESS=true \
            -DBROWSER=$BROWSER

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 5


